```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | VINEELA BLOG</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            background: linear-gradient(
                135deg,
                #faf6f0,
                #f1e7dc
            );

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .signup-container {
            width: 900px;
            max-width: 100%;
            min-height: 560px;

            background: #fffdf9;

            border-radius: 18px;
            overflow: hidden;

            display: flex;

            box-shadow:
                0 12px 35px rgba(47, 36, 31, 0.15);
        }

        .welcome-section {
            width: 45%;

            background: #2f241f;
            color: white;

            padding: 55px 45px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            position: relative;
        }

        .welcome-section::after {
            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            border-radius: 50%;

            background: rgba(201, 107, 59, 0.12);

            right: -60px;
            bottom: -50px;
        }

        .logo {
            color: #c96b3b;

            font-size: 27px;
            font-weight: bold;

            letter-spacing: 2px;

            margin-bottom: 45px;
        }

        .welcome-section h1 {
            font-size: 40px;
            margin-bottom: 18px;
        }

        .welcome-section p {
            color: #e5d8ce;

            font-size: 16px;
            line-height: 1.7;
        }

        .home-link {
            margin-top: 40px;

            color: #c96b3b;

            text-decoration: none;

            font-weight: bold;
        }

        .home-link:hover {
            color: #e58a5d;
            text-decoration: underline;
        }

        .signup-section {
            width: 55%;

            padding: 45px 60px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .signup-section h2 {
            color: #8b4513;

            font-size: 32px;

            margin-bottom: 8px;
        }

        .subtitle {
            color: #665a53;

            margin-bottom: 25px;

            font-size: 15px;
        }

        .input-group {
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;

            margin-bottom: 7px;

            color: #2f241f;

            font-weight: bold;

            font-size: 14px;
        }

        .input-group input {
            width: 100%;

            padding: 13px 16px;

            border: 2px solid #e1d4c7;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            background: #fffdf9;

            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #c96b3b;

            box-shadow:
                0 0 0 3px rgba(201, 107, 59, 0.12);
        }

        .signup-button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #c96b3b;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            margin-top: 5px;
        }

        .signup-button:hover {
            background: #a9532c;

            transform: translateY(-2px);

            box-shadow:
                0 7px 18px rgba(201, 107, 59, 0.25);
        }

        #signupMessage {
            text-align: center;

            margin-top: 15px;

            min-height: 20px;

            font-size: 14px;
        }

        .login-text {
            text-align: center;

            margin-top: 20px;

            color: #665a53;

            font-size: 14px;
        }

        .login-text a {
            color: #c96b3b;

            font-weight: bold;

            text-decoration: none;
        }

        .login-text a:hover {
            color: #8b4513;

            text-decoration: underline;
        }

        @media (max-width: 700px) {

            .signup-container {
                flex-direction: column;
            }

            .welcome-section {
                width: 100%;

                min-height: 260px;

                padding: 35px;
            }

            .welcome-section h1 {
                font-size: 32px;
            }

            .logo {
                margin-bottom: 25px;
            }

            .signup-section {
                width: 100%;

                padding: 40px 30px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <div class="welcome-section">

            <div class="logo">
                VINEELA BLOG
            </div>

            <h1>
                Join Us!
            </h1>

            <p>
                Create your account and start
                exploring stories, ideas, learning
                experiences and personal journeys.
            </p>

            <a href="index.html" class="home-link">
                ← Back to Home
            </a>

        </div>


        <div class="signup-section">

            <h2>
                Create Account
            </h2>

            <p class="subtitle">
                Fill in your details to get started.
            </p>

            <form id="signupForm">

                <div class="input-group">

                    <label for="signupName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="signupName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="signupEmail">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="signup-button"
                >
                    Create Account
                </button>

                <p id="signupMessage"></p>

            </form>


            <p class="login-text">

                Already have an account?

                <a href="login.html">
                    Sign In
                </a>

            </p>

        </div>

    </div>


    <script>

        document
            .getElementById("signupForm")
            .addEventListener("submit", async function(event) {

                event.preventDefault();

                const name =
                    document
                    .getElementById("signupName")
                    .value
                    .trim();

                const email =
                    document
                    .getElementById("signupEmail")
                    .value
                    .trim();

                const password =
                    document
                    .getElementById("signupPassword")
                    .value;

                const confirmPassword =
                    document
                    .getElementById("confirmPassword")
                    .value;

                const message =
                    document
                    .getElementById("signupMessage");


                if (password !== confirmPassword) {

                    message.textContent =
                        "Passwords do not match.";

                    message.style.color =
                        "red";

                    return;
                }


                if (password.length < 6) {

                    message.textContent =
                        "Password must be at least 6 characters.";

                    message.style.color =
                        "red";

                    return;
                }


                message.textContent =
                    "Creating account...";

                message.style.color =
                    "#c96b3b";


                try {

                    const response = await fetch(
                        "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=AIzaSyDAVS0nYJouL-w-xcazvVSI0nydKvibWUM",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({

                                email: email,

                                password: password,

                                returnSecureToken: true

                            })
                        }
                    );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.error.message
                        );

                    }


                    message.textContent =
                        "Account created successfully!";

                    message.style.color =
                        "green";


                    setTimeout(function() {

                        window.location.href =
                            "login.html";

                    }, 1000);


                } catch (error) {

                    let errorMessage =
                        error.message;


                    if (
                        errorMessage ===
                        "EMAIL_EXISTS"
                    ) {

                        errorMessage =
                            "This email is already registered.";

                    }


                    message.textContent =
                        errorMessage;

                    message.style.color =
                        "red";

                }

            });

    </script>

</body>

</html>
