<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | VINEELA BLOG</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #faf6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 400px;
            background: #fffdf9;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(47, 36, 31, 0.15);
        }

        h1 {
            text-align: center;
            color: #2f241f;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #8b4513;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #2f241f;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 2px solid #e1d4c7;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #c96b3b;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #c96b3b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #a9532c;
        }

        #loginMessage {
            text-align: center;
            margin-top: 15px;
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: #c96b3b;
            text-decoration: none;
            font-weight: bold;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <h1>VINEELA BLOG</h1>

        <h2>Sign In</h2>

        <form id="loginForm">

            <label for="loginEmail">Email Address</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
            >

            <label for="loginPassword">Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Sign In
            </button>

            <p id="loginMessage"></p>

        </form>

        <div class="links">
            <p>
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

            <p>
                <a href="index.html">← Back to Home</a>
            </p>
        </div>

    </div>

    <script>

        document.getElementById("loginForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("loginEmail").value.trim();

            const password =
                document.getElementById("loginPassword").value;

            const message =
                document.getElementById("loginMessage");

            message.textContent = "Signing in...";
            message.style.color = "#c96b3b";

            try {

                const response = await fetch(
                    "https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=AIzaSyDAVS0nYJouL-w-xcazvVSI0nydKvibWUM",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password,
                            returnSecureToken: true
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error.message);
                }

                message.textContent = "Login successful!";
                message.style.color = "green";

                setTimeout(function() {
                    window.location.href = "index.html";
                }, 1000);

            } catch (error) {

                if (error.message === "INVALID_LOGIN_CREDENTIALS") {
                    message.textContent =
                        "Incorrect email or password.";
                } else {
                    message.textContent =
                        error.message;
                }

                message.style.color = "red";
            }

        });

    </script>

</body>

</html>
